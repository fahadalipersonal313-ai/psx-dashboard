name: Dashboard smoke test
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Compile, import every dashboard module, run the tests
        run: |
          python -m py_compile *.py
          python -c "import backtester, config, corporate_actions, data_fetcher, data_quality, database, decision_engine, exchange_closures, history_view, market_factors, market_regime, momentum, news_desk, news_feed, news_memory, news_review_panel, news_window, opportunity_cards, position_sizing, remote_data, risk_manager, runtime_bootstrap, scoring_engine, session_calendar, shariah_checker, signal_generator, ssl_compat, swing_evaluation, target_timing, technical_analyzer, trading_review, upward_candidates; print('dashboard imports OK')"
          python -m unittest test_remote_cache test_remote_data test_news_desk test_news_review_panel test_dashboard_public_access -q

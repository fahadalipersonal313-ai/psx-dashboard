name: Dashboard import smoke test
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Compile and import frontend dependencies
        run: |
          python -m py_compile *.py
          python - <<'PY'
          import intraday_momentum, intraday_tracking, orderbook
          import short_horizon, short_horizon_panel, opportunity_cards
          import trading_review, portfolio_advisor, portfolio_risk, position_sizing
          import shariah_checker, corporate_actions, news_review_panel
          import news_desk, remote_data, news_memory, depth_analysis, upward_candidates
          print("frontend dependency imports OK")
          PY

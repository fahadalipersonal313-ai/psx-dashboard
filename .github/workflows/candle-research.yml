name: PSX Candle Research
on:
  schedule:
    # 03:20 PKT Tuesday-Saturday: previous trading day's evening data.
    - cron: '20 22 * * 1-5'
  workflow_dispatch:
    inputs:
      install_patch:
        description: 'One-time installation of the reviewed research patch'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: psx-dashboard-candle-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install reviewed research source once
        if: github.event_name == 'workflow_dispatch' && inputs.install_patch
        env:
          EXPECTED_PATCH_SHA256: 3bc8ad80cbdc78dd24a64608d88bc63e0dc8c6a706327497c95b97d954d01e9f
        run: |
          test "$GITHUB_REPOSITORY" = 'fahadalipersonal313-ai/psx-dashboard'
          printf '%s  candle-research.patch\n' "$EXPECTED_PATCH_SHA256" | sha256sum --check
          git apply --check candle-research.patch
          git apply candle-research.patch
          python -m pip install -r requirements-research.txt
          python -m unittest discover -s tools/candle_research -p 'test_*.py' -q
          python -m py_compile *.py tools/candle_research/*.py
          git config user.name 'PSX cloud research'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm candle-research.patch
          git add .gitignore README.md remote_data.py requirements-research.txt docs/candle-research skills/psx-candle-research tools/candle_research
          git diff --cached --check
          git commit -m 'Add validated daily candle research without changing live calls'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 3
            git pull --rebase origin main
          done
      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Verify research safeguards
        run: python -m unittest discover -s tools/candle_research -p 'test_*.py' -q
      - name: Restore small durable evidence branch
        run: |
          ledger="$RUNNER_TEMP/psx-research-ledger"
          if git ls-remote --exit-code --heads origin research-evidence > "$RUNNER_TEMP/ledger-ref.txt"; then
            git fetch --depth=1 origin research-evidence
            git worktree add -b research-evidence "$ledger" FETCH_HEAD
          else
            lookup_status=$?
            test "$lookup_status" -eq 2
            test ! -s "$RUNNER_TEMP/ledger-ref.txt"
            mkdir -p "$ledger"
            git -C "$ledger" init -b research-evidence
            git -C "$ledger" remote add origin "$(git remote get-url origin)"
            git -C "$ledger" config http.https://github.com/.extraheader "$(git config --get http.https://github.com/.extraheader)"
          fi
      - name: Read completed data and record candle evidence
        run: |
          python tools/candle_research/cloud.py --repo . \
            --downloads "$RUNNER_TEMP/psx-candle-snapshots" \
            --output "$RUNNER_TEMP/psx-candle-report" \
            --checkpoints "$RUNNER_TEMP/psx-research-ledger/checkpoints"
      - name: Publish at most one small checkpoint per trading session
        run: |
          ledger="$RUNNER_TEMP/psx-research-ledger"
          git -C "$ledger" config user.name 'PSX cloud research'
          git -C "$ledger" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$ledger" add checkpoints
          if git -C "$ledger" diff --cached --quiet; then
            echo 'No new session evidence; no push.'
            exit 0
          fi
          git -C "$ledger" diff --cached --check
          git -C "$ledger" commit -m 'Record completed-session candle evidence'
          for attempt in 1 2 3; do
            if git -C "$ledger" push origin HEAD:research-evidence; then break; fi
            test "$attempt" -lt 3
            git -C "$ledger" pull --rebase origin research-evidence
          done
      - name: Attach summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/psx-candle-report/summary.md"; then
            cat "$RUNNER_TEMP/psx-candle-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve reports and charts, never the downloaded database
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: psx-candle-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/psx-candle-report/
          if-no-files-found: warn
          retention-days: 90
